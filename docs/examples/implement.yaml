# Sketch of the implement lifecycle: claim, make the feedback check green, open a PR, clean up.
id: implement
seq:
  - action: claim
  - ensure:
      cond:
        check: feedback-check
      else:
        retry: 3
        do:
          agent: tdd-afk
  - ensure:
      cond:
        check: required-checks-green
      else:
        action: open-pr
  - action: cleanup
